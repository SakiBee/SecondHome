<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Header</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        /* Ensures the badge is positioned correctly on the icon */
        .notification-badge {
            position: absolute;
            top: 0;
            right: -10px;
            padding: 3px 6px;
            border-radius: 50%;
            background-color: red;
            color: white;
            font-size: 0.65rem;
            line-height: 1;
        }
        .notification-icon-container {
            position: relative;
            display: inline-block;
        }
    </style>
</head>
<body>
<div th:fragment="header">
    <nav class="navbar navbar-expand-lg bg-custom-teal fixed-top navbar-dark shadow-sm" >
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/"><i class="fa-solid fa-calendar-check me-2"></i> Second Home</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">

                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/"><i class="fa-solid fa-house me-1"></i> Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/halls"><i class="fa-solid fa-city me-1"></i> Halls</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/events"><i class="fa-solid fa-calendar-alt me-1"></i> Events</a>
                    </li>

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fa-solid fa-list me-1"></i> Categories
                        </a>
                        <ul class="dropdown-menu">
                            <li th:each="cat : ${category}"><a class="dropdown-item" th:href="@{'/events?category='+${cat.name}}">[[${cat.name}]]</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="/events">View All</a></li>
                        </ul>
                    </li>
                </ul>

                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
                    <th:block sec:authorize="!isAuthenticated()">
                        <li class="nav-item me-2">
                            <a class="nav-link btn btn-light px-3" aria-current="page" href="/signin">
                                <i class="fa-solid fa-sign-in-alt me-1"></i> Login
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link btn btn-light px-3" aria-current="page" href="/register"> Register</a>
                        </li>
                    </th:block>

                    <th:block sec:authorize="isAuthenticated()">
                        <th:block sec:authorize="hasRole('ROLE_USER')">
                            <li class="nav-item me-3">
                                <a class="nav-link active p-0" aria-current="page" href="/user/notifications">
                                    <div class="notification-icon-container">
                                        <i class="fa-solid fa-bell fa-lg"></i>
                                        <span th:if="${productCount != null and productCount > 0}"
                                              class="badge rounded-pill bg-danger notification-badge">
                                            [[${productCount}]]
                                        </span>
                                    </div>
                                </a>
                            </li>

                        </th:block>

                        <li class="nav-item dropdown me-3">
                            <a class="nav-link dropdown-toggle active" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="fa-solid fa-user-circle me-1"></i>
                                <span sec:authentication="name"></span>
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li><a class="dropdown-item" href="/user/profile">Profile</a></li>
                                <th:block sec:authorize="hasRole('ROLE_USER')">
                                    <li><a class="dropdown-item" href="/user/my-bookings">My Bookings</a></li>
                                </th:block>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item" href="/logout"><i class="fa-solid fa-sign-out-alt me-1"></i> Logout</a></li>
                            </ul>
                        </li>
                    </th:block>
                </ul>
            </div>
        </div>
    </nav>
</div>
</body>
</html>
