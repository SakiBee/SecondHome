<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base::layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
</head>
<body>
<section>
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="row w-100">
            <div class="col-lg-6 col-md-8 mx-auto">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-header bg-custom-teal text-white text-center rounded-top-4 py-3">
                        <h2 class="mb-0 fw-bold">Create Your Account</h2>
                    </div>

                    <div class="card-body px-5 py-4">
                        <th:block th:if="${successMsg}">
                            <div class="alert alert-success text-center fw-bold" role="alert">
                                [[${successMsg}]]
                            </div>
                        </th:block>
                        <th:block th:if="${errorMsg}">
                            <div class="alert alert-danger text-center fw-bold" role="alert">
                                [[${errorMsg}]]
                            </div>
                        </th:block>

                        <form method="post" action="/saveUser" enctype="multipart/form-data">

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="fullName" class="form-label fw-semibold">Full Name</label>
                                    <input class="form-control" id="fullName" name="name" type="text" placeholder="John Doe" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="mobileNumber" class="form-label fw-semibold">Mobile Number</label>
                                    <input class="form-control" id="mobileNumber" name="mobileNumber" type="tel" pattern="[0-9]*" placeholder="e.g., 9876543210" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">Email Address</label>
                                <input class="form-control" id="email" name="email" type="email" placeholder="you@example.com" required>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="city" class="form-label fw-semibold">City</label>
                                    <input class="form-control" id="city" name="city" type="text" placeholder="New York" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="postCode" class="form-label fw-semibold">Post Code</label>
                                    <input class="form-control" id="postCode" name="postCode" type="number" placeholder="10001" required>
                                </div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="password" class="form-label fw-semibold">Password</label>
                                    <input class="form-control" id="password" name="password" type="password" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="confirmPassword" class="form-label fw-semibold">Confirm Password</label>
                                    <input class="form-control" id="confirmPassword" name="confirmPassword" type="password" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="profilePhoto" class="form-label fw-semibold">Profile Photo (Optional)</label>
                                <input class="form-control" id="profilePhoto" name="file" type="file">
                            </div>

                            <button type="submit" class="btn btn-custom-teal btn-lg w-100 fw-bold mb-3">
                                <i class="bi bi-person-plus-fill me-2"></i> Register Account
                            </button>
                        </form>

                        <div class="text-center">
                            <p class="text-muted mb-0">Already have an account?
                                <a href="/signin" class="text-custom-teal fw-bold text-decoration-none">Log In Here</a>
                            </p>
                        </div>
                    </div> </div> </div> </div> </div> </section>
</body>
</html>
